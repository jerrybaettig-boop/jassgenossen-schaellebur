            color: var(--ink-black);

            background-color: #fff;
            border: 3px solid var(--ink-black);
            border-radius: 12px;
            box-shadow: 6px 6px 0px rgba(0,0,0,1);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .retro-card:active { 
            transform: translate(2px, 2px); 
            box-shadow: 4px 4px 0px rgba(0,0,0,1); 
        }

        .retro-btn {
            background-color: var(--swiss-red);
            color: white;
            border: 3px solid var(--ink-black);
            border-radius: 8px;
            font-family: 'Bangers', cursive;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
            transition: transform 0.1s;
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .retro-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 2px 2px 0px rgba(0,0,0,1); 
        }

            background-color: var(--gold-base);

            background-color: white;

            border-radius: 8px;
            font-family: 'Bangers', cursive;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            outline: none;
        }
        
        .retro-input:focus { 
            border-color: var(--swiss-red); 
        }

        .header-pattern-container {
            position: absolute; 
            inset: 0; 
            z-index: 0;
            background-color: var(--gold-base);
            border-bottom: 4px solid var(--ink-black);
        }
        
        .header-pattern-img {
            position: absolute; 
            inset: 0; 
            z-index: 0;
            background-repeat: repeat;
            background-size: 60px 60px;
            opacity: 0.2;
            filter: brightness(10) grayscale(60%);
        }

        .avatar-card-frame {
            width: 70px; 
            height: 100px; 
            border: 3px solid var(--ink-black); 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
            box-shadow: 2px 2px 0px rgba(0,0,0,1);
        }
        
        .avatar-img-pinned {
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-position: bottom;
            transform: translateY(14%) scale(1.2); 
            transform-origin: bottom center;
        }
        
        .tab-btn-active {
            background-color: var(--gold-base) !important;
            color: var(--ink-black) !important;
            transform: translateY(-4px);
            box-shadow: 2px 2px 0px #d80018 !important;
        }

        .modal-overlay { 
            background-color: rgba(26, 26, 26, 0.95); 
            backdrop-filter: blur(4px); 
        }
        
        .stamp-definitiv {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 4px solid #166534; 
            color: #166534; 
            padding: 5px 10px;
            font-family: 'Bangers', cursive; 
            font-size: 2rem; 
            text-transform: uppercase;
            opacity: 0.8; 
            pointer-events: none; 
            mix-blend-mode: multiply; 
            z-index: 10;
        }

        .animate-in { 
            animation: animateIn 0.3s ease-out forwards; 
        }
        
        @keyframes animateIn { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }
        
        input[type=range] { 
            -webkit-appearance: none; 
            appearance: none; 
            width: 100%; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            appearance: none; 
            height: 24px; 
            width: 24px; 
            border-radius: 50%; 
            background: #D80018; 
            border: 2px solid black; 
            cursor: pointer; 
            margin-top: -10px; 
        }
        
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 6px; 
            cursor: pointer; 
            background: #e2e8f0; 
            border-radius: 3px; 
            border: 1px solid #94a3b8; 
        }

        .bracket-match { background:#fff; }
        .bracket-connector { position:relative; }

        .bracket-canvas { position: relative; }
        .bracket-svg-lines { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

        .confetti-piece {
            position: fixed;
            top: -20px;
            z-index: 9999;
            pointer-events: none;
            border-radius: 2px;
            animation-name: confetti-fall;
            animation-timing-function: cubic-bezier(0.35, 0, 0.65, 1);
            animation-fill-mode: forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0.9; }
        }
        @media (prefers-reduced-motion: reduce) {
            .confetti-piece { animation: none; display: none; }
        }

            const weis = side === 'A' ? r.wA : r.wB;

        // Zeichnet SVG-Verbindungslinien zwischen Matches innerhalb einer Bracket-Sektion (WB bzw. LB).
        window.drawBracketConnectors = () => {
            if (!bracketDoc || !bracketDoc.matches) return;
            const sections = [
                { canvasId: 'wb-canvas', svgId: 'wb-svg', ids: bracketDoc.matches.filter(m => !m.isLB && !m.isGrandFinal).map(m => m.id) },
                { canvasId: 'lb-canvas', svgId: 'lb-svg', ids: bracketDoc.matches.filter(m => m.isLB).map(m => m.id) },
            ];
            sections.forEach(sec => {
                const canvas = document.getElementById(sec.canvasId);
                const svg = document.getElementById(sec.svgId);
                if (!canvas || !svg) return;
                svg.innerHTML = '';
                svg.setAttribute('width', canvas.scrollWidth);
                svg.setAttribute('height', canvas.scrollHeight);
                const canvasRect = canvas.getBoundingClientRect();
                sec.ids.forEach(id => {
                    const m = bracketDoc.matches.find(x => x.id === id);
                    if (!m || !m.winnerTo) return;
                    const [targetId] = m.winnerTo.split(':');
                    if (!sec.ids.includes(targetId)) return;
                    const srcEl = canvas.querySelector(`[data-match-id="${id}"]`);
                    const tgtEl = canvas.querySelector(`[data-match-id="${targetId}"]`);
                    if (!srcEl || !tgtEl) return;
                    const s = srcEl.getBoundingClientRect(), t = tgtEl.getBoundingClientRect();
                    const x1 = s.right - canvasRect.left + canvas.scrollLeft;
                    const y1 = s.top + s.height / 2 - canvasRect.top + canvas.scrollTop;
                    const x2 = t.left - canvasRect.left + canvas.scrollLeft;
                    const y2 = t.top + t.height / 2 - canvasRect.top + canvas.scrollTop;
                    const midX = x1 + (x2 - x1) / 2;
                    const done = !!m.winnerId;
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`);
                    path.setAttribute('stroke', done ? '#d4af37' : '#cbd5e1');
                    path.setAttribute('stroke-width', done ? '3' : '2');
                    if (!done) path.setAttribute('stroke-dasharray', '5,5');
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke-linecap', 'round');
                    svg.appendChild(path);
                });
            });
        };

                const m = matches.find(x => x.id === mId);
                if (!m) return 'TBD';
                const tid = slot === 'A' ? m.teamA : m.teamB;
                if (!tid) return 'TBD';
                if (tid === 'BYE') return 'Freilos';
                return (teamsById[tid] || {}).name || 'TBD';
            };

            const renderTeamRow = (m, slot, total, isWinnerRow) => {
                const name = teamName(m.id, slot);
                const isTBD = name === 'TBD';
                const isBye = name === 'Freilos';
                return `
                <div class="flex items-center justify-between px-3 py-2 relative ${isWinnerRow ? 'bg-gradient-to-r from-yellow-300 to-amber-400 font-bold text-slate-900' : 'bg-slate-900/95 text-slate-200'} ${isTBD || isBye ? 'opacity-40' : ''}">
                    <span class="text-xs sm:text-sm truncate flex items-center gap-1.5">
                        ${isWinnerRow ? '<i data-lucide="crown" class="w-3.5 h-3.5 text-slate-900 shrink-0"></i>' : ''}
                        ${name}
                    </span>
                    <span class="text-xs sm:text-sm font-mono font-bold shrink-0 ml-2">${(m.rounds||[]).length ? total : ''}</span>
                </div>`;
            };

            const renderMatchCard = (m) => {
                if (!m) return '';
                const done = !!m.winnerId;
                const live = !done && (m.rounds || []).length > 0;
                const totalA = matchSumPoints(m, mults, 'A');
                const totalB = matchSumPoints(m, mults, 'B');
                const teamsKnown = m.teamA && m.teamB && m.teamA !== 'BYE' && m.teamB !== 'BYE';
                const canEnterAsParticipant = !done && teamsKnown && (teamHasUser(m.teamA) || teamHasUser(m.teamB));
                const canEnterAsAdmin = isAdmin() && teamsKnown;
                const canAct = canEnterAsAdmin || canEnterAsParticipant;

                return `
                <div class="bracket-match-wrap relative mb-7" data-match-id="${m.id}">
                    <div class="bracket-match rounded-lg overflow-hidden border-2 border-black ${live ? 'ring-2 ring-swiss-red animate-pulse' : ''} ${done ? 'shadow-[3px_3px_0_#d4af37] opacity-90' : 'shadow-[3px_3px_0_black]'}">
                        <div class="flex items-center justify-between px-2 py-1 bg-black">
                            <span class="text-[9px] font-bold uppercase text-yellow-400 tracking-wider">${m.round}</span>
                            ${live ? '<span class="flex items-center gap-1 text-[8px] font-bold uppercase text-red-400"><span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span>Live</span>' : ''}
                            ${done ? '<i data-lucide="lock" class="w-3 h-3 text-yellow-400"></i>' : ''}
                        </div>
                        <div class="divide-y divide-black/40">
                            ${renderTeamRow(m, 'A', totalA, done && m.winnerId === m.teamA)}
                            ${renderTeamRow(m, 'B', totalB, done && m.winnerId === m.teamB)}
                        </div>
                    </div>
                    ${canAct ? (done
                        ? `<button onclick="openScoringModal('${m.id}')" class="w-full mt-1.5 text-[9px] bg-white border border-slate-300 text-slate-400 py-1 rounded uppercase hover:text-slate-700 hover:border-slate-400 transition-colors flex items-center justify-center gap-1"><i data-lucide="lock-open" class="w-3 h-3"></i> Admin: wieder öffnen</button>`
                        : `<button onclick="openScoringModal('${m.id}')" class="w-full mt-1.5 text-[10px] bg-swiss-red text-white border-2 border-black py-1 rounded font-bold uppercase shadow-[2px_2px_0_black] hover:translate-y-[1px] hover:shadow-none transition-all flex items-center justify-center gap-1"><i data-lucide="${live ? 'play' : 'swords'}" class="w-3 h-3"></i> ${live ? 'Weiterspielen' : 'Spiel starten'}</button>`
                    ) : ''}
                </div>`;
            };

            const wbMatches = matches.filter(m => !m.isLB && !m.isGrandFinal);
            const lbMatches = matches.filter(m => m.isLB);
            const gf = matches.find(m => m.id === 'gf');
            const gf2 = matches.find(m => m.id === 'gf2');
            const champion = computeChampion(matches, teamsById);

            const groupByRound = (list) => { const g = {}; list.forEach(m => { (g[m.round] = g[m.round] || []).push(m); }); return g; };
            const wbRounds = groupByRound(wbMatches);
            const lbRounds = groupByRound(lbMatches);

            const renderBracketSection = (title, icon, colorClass, rounds, canvasId) => `
                <div>
                    <div class="inline-flex items-center gap-2 mb-4 px-3 py-1.5 rounded-full ${colorClass} border-2 border-black shadow-[2px_2px_0_black]">
                        <i data-lucide="${icon}" class="w-4 h-4"></i>
                        <span class="font-comic text-sm uppercase tracking-wide">${title}</span>
                    </div>
                    <div id="${canvasId}" class="bracket-canvas bracket-scroll flex gap-10 pb-4">
                        <svg id="${canvasId.replace('canvas','svg')}" class="bracket-svg-lines"></svg>
                        ${Object.entries(rounds).map(([round, ms]) => `
                            <div class="bracket-col shrink-0 flex flex-col justify-around relative z-10">
                                <div class="text-center text-[10px] font-bold uppercase text-slate-400 mb-3 tracking-widest">${round}</div>
                                ${ms.map(renderMatchCard).join('')}
                            </div>
                        `).join('')}
                    </div>
                </div>`;

            setTimeout(() => window.drawBracketConnectors(), 60);

            return `
            <div class="space-y-8 animate-in fade-in duration-500 px-2 pb-24 max-w-6xl mx-auto w-full">
                <div class="flex items-center justify-between px-1">
                    <div>
                        <h3 class="text-3xl font-comic text-slate-900 transform -rotate-1">Turnierbaum</h3>
                        <p class="text-xs text-slate-400 font-mono uppercase">${tourney.name}</p>
                    </div>
                    ${isAdmin() ? `<button onclick="resetTourneyTeamsAndBracket('${tourney.id}')" class="bg-white border-2 border-red-400 text-red-500 px-3 py-1 rounded-lg text-xs font-bold uppercase hover:bg-red-50 shrink-0">Zurücksetzen</button>` : ''}
                </div>

                ${champion ? `
                <div class="relative overflow-hidden rounded-2xl border-4 border-black bg-gradient-to-br from-yellow-300 via-amber-400 to-yellow-500 p-8 text-center shadow-[6px_6px_0_black]">
                    <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(black 1px, transparent 1px); background-size: 14px 14px;"></div>
                    <div class="relative z-10">
                        <i data-lucide="trophy" class="w-12 h-12 mx-auto text-slate-900 mb-2 drop-shadow"></i>
                        <div class="text-xs uppercase text-slate-800/70 font-bold tracking-[0.3em] mb-1">Turnier beendet — Champion</div>
                        <div class="text-5xl font-comic text-slate-900 drop-shadow-sm">${champion}</div>
                        <p class="text-[11px] text-slate-800/70 mt-3 max-w-sm mx-auto">Das Turnier ist entschieden. Offen bleiben ab jetzt nur noch Freispiele — oder startet auf der Event-Seite eine neue Runde mit denselben Teilnehmern.</p>
                        <a href="event.html?id=${tourney.id}" class="inline-block mt-3 text-xs font-bold text-slate-900 underline">Zur Event-Seite</a>
                    </div>
                </div>` : `
                <div class="retro-card p-3 bg-slate-50 !border-slate-300 flex items-center gap-3 text-xs text-slate-500">
                    <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
                    ${isAdmin() ? 'Als Admin könnt ihr jedes Spiel öffnen, um es zu starten oder ein bereits entschiedenes Resultat zu korrigieren.' : 'Klickt euer Match an, um live Resultate einzutragen.'}
                </div>`}

                ${renderBracketSection('Winner Bracket', 'trending-up', 'bg-blue-100 text-blue-800', wbRounds, 'wb-canvas')}
                ${Object.keys(lbRounds).length ? renderBracketSection('Loser Bracket', 'trending-down', 'bg-red-100 text-red-800', lbRounds, 'lb-canvas') : ''}

                <div class="inline-flex items-center gap-2 mb-4 px-3 py-1.5 rounded-full bg-yellow-100 text-yellow-800 border-2 border-black shadow-[2px_2px_0_black]">
                    <i data-lucide="award" class="w-4 h-4"></i>
                    <span class="font-comic text-sm uppercase tracking-wide">Grand Final</span>
                </div>
                <div class="bracket-scroll flex gap-8 pb-4 -mt-4">
                    <div class="bracket-col shrink-0">${renderMatchCard(gf)}</div>
                    ${gf2 ? `<div class="bracket-col shrink-0"><div class="text-center text-[10px] font-bold uppercase text-slate-400 mb-3 tracking-widest">Entscheidungsspiel</div>${renderMatchCard(gf2)}</div>` : ''}
                </div>

                ${renderTourneyStats()}
            </div>`;
        };

        const renderScoringModal = () => {
            const m = (bracketDoc.matches || []).find(x => x.id === scoringMatchId);
            if (!m) return '';
            const mults = (tourney.rules && tourney.rules.mults) || RULE_PRESETS.klassisch.mults;
            const modes = trumpModesFromRules(tourney.rules);
            const teamsById = {}; (bracketDoc.teams || []).forEach(tm => teamsById[tm.id] = tm);
            const nameA = (teamsById[m.teamA] || {}).name || 'Team A';
            const nameB = (teamsById[m.teamB] || {}).name || 'Team B';
            const totalA = matchSumPoints(m, mults, 'A');
            const totalB = matchSumPoints(m, mults, 'B');
            const done = !!m.winnerId;
            if (!scoringTrump) scoringTrump = modes[0].id;

            return `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onclick="closeModal(event)">
                <div class="retro-card p-5 w-full max-w-md bg-white relative max-h-[92vh] overflow-y-auto border-4 border-black">
                    <button onclick="closeModal(null, true)" class="absolute top-2 right-2 text-slate-400 hover:text-black"><i data-lucide="x"></i></button>
                    <div class="flex items-center gap-2 mb-3">
                        <h2 class="text-xl font-comic text-slate-900">${m.round}</h2>
                        ${done ? '<span class="text-[9px] font-bold uppercase bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full border border-amber-300">Bereits entschieden — Admin-Korrektur</span>' : ''}
                    </div>
                    ${done && isAdmin() ? `<p class="text-[11px] text-slate-400 mb-3">Achtung: Wenn nachfolgende Spiele im Baum bereits gespielt wurden, kann eine Korrektur hier zu Inkonsistenzen weiter oben im Baum führen — im Zweifel danach auch die Folge-Matches prüfen.</p>` : ''}
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="retro-card !min-h-0 bg-blue-50 p-2 text-center !border-blue-800"><div class="text-[10px] uppercase text-blue-400 font-bold">${nameA}</div><div class="text-3xl font-comic text-blue-900">${totalA}</div></div>
                        <div class="retro-card !min-h-0 bg-red-50 p-2 text-center !border-red-800"><div class="text-[10px] uppercase text-red-400 font-bold">${nameB}</div><div class="text-3xl font-comic text-red-900">${totalB}</div></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mb-3">
                        ${modes.map(tm => `
                            <button type="button" data-trump-btn="${tm.id}" onclick="selectScoringTrump('${tm.id}')"
                                class="trump-mode-btn flex flex-col items-center justify-center p-2 rounded border-2 transition-all ${scoringTrump === tm.id ? 'bg-slate-800 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-500'}">
                                <span class="text-xl">${tm.icon}</span>
                                <span class="text-[9px] font-bold uppercase mt-1">${tm.label} <span class="bg-yellow-400 text-black px-1 rounded">${tm.mult}×</span></span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div><label class="block text-[10px] font-bold text-blue-900 uppercase text-center mb-1">Punkte ${nameA}</label><input type="number" id="score-pa" min="0" max="157" placeholder="0" oninput="syncMatchPoints('a')" class="retro-input w-full h-12 text-center text-2xl"></div>
                        <div><label class="block text-[10px] font-bold text-red-900 uppercase text-center mb-1">Punkte ${nameB}</label><input type="number" id="score-pb" min="0" max="157" placeholder="0" oninput="syncMatchPoints('b')" class="retro-input w-full h-12 text-center text-2xl"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div><label class="block text-[10px] font-bold text-blue-400 uppercase text-center mb-1">Weis</label><input type="number" id="score-wa" placeholder="0" class="text-center w-full text-lg font-mono border-b-2 border-slate-300 bg-transparent py-1"></div>
                        <div><label class="block text-[10px] font-bold text-red-400 uppercase text-center mb-1">Weis</label><input type="number" id="score-wb" placeholder="0" class="text-center w-full text-lg font-mono border-b-2 border-slate-300 bg-transparent py-1"></div>
                    </div>
                    <button onclick="submitMatchRound()" class="w-full retro-btn py-3 mb-4">Runde speichern</button>

                    ${(m.rounds||[]).length ? `<div class="text-[10px] font-bold uppercase text-slate-400 mb-2">${m.rounds.length} Runde(n) gespielt</div>` : ''}

                    <div class="border-t border-slate-200 pt-3">
                        <div class="text-[10px] font-bold uppercase text-slate-400 mb-2">${done ? 'Sieger korrigieren' : 'Spiel abschliessen'}</div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="finalizeMatch('${m.id}','A')" class="retro-btn-secondary retro-btn py-2 text-xs ${done && m.winnerId===m.teamA ? '!bg-yellow-400' : ''}">${nameA} gewinnt</button>
                            <button onclick="finalizeMatch('${m.id}','B')" class="retro-btn-secondary retro-btn py-2 text-xs ${done && m.winnerId===m.teamB ? '!bg-yellow-400' : ''}">${nameB} gewinnt</button>
                        </div>
                    </div>
                </div>
            </div>`;
        };

        let showTourneyStats = false;

        const computeTourneyStats = () => {
            const matches = (bracketDoc && bracketDoc.matches) || [];
            const mults = (tourney && tourney.rules && tourney.rules.mults) || RULE_PRESETS.klassisch.mults;
            const teamsById = {};
            ((bracketDoc && bracketDoc.teams) || []).forEach(tm => teamsById[tm.id] = tm);

            const stats = {}; // teamId -> { name, wins, losses, points, weis, trumps: {suitId: count}, games: [] }
            const ensure = (tid) => {
                if (!tid || tid === 'BYE') return null;
                if (!stats[tid]) stats[tid] = { name: (teamsById[tid] || {}).name || tid, wins: 0, losses: 0, points: 0, weis: 0, trumps: {}, gamesPlayed: 0 };
                return stats[tid];
            };

            const gameLog = [];

            matches.forEach(m => {
                if (!m.teamA || !m.teamB || m.teamA === 'BYE' || m.teamB === 'BYE') return;
                const sA = ensure(m.teamA), sB = ensure(m.teamB);
                if (!sA || !sB) return;
                const rounds = m.rounds || [];
                if (rounds.length === 0 && !m.winnerId) return; // noch nicht gespielt

                let totalA = 0, totalB = 0;
                rounds.forEach(r => {
                    const mult = mults[r.trumpId] || 1;
                    const valA = r.pA === 157 ? 257 : r.pA;
                    const valB = r.pB === 157 ? 257 : r.pB;
                    totalA += (valA * mult) + (r.wA * mult);
                    totalB += (valB * mult) + (r.wB * mult);
                    sA.weis += r.wA || 0;
                    sB.weis += r.wB || 0;
                    if (r.trumpId) {
                        sA.trumps[r.trumpId] = (sA.trumps[r.trumpId] || 0) + 1;
                        sB.trumps[r.trumpId] = (sB.trumps[r.trumpId] || 0) + 1;
                    }
                });
                sA.points += totalA; sB.points += totalB;
                if (m.winnerId) {
                    sA.gamesPlayed++; sB.gamesPlayed++;
                    if (m.winnerId === m.teamA) { sA.wins++; sB.losses++; } else { sB.wins++; sA.losses++; }
                    gameLog.push({ round: m.round, nameA: sA.name, nameB: sB.name, totalA, totalB, winner: m.winnerId === m.teamA ? sA.name : sB.name });
                } else if (rounds.length) {
                    gameLog.push({ round: m.round, nameA: sA.name, nameB: sB.name, totalA, totalB, winner: null });
                }
            });

            const teamList = Object.values(stats).sort((a, b) => b.points - a.points);
            return { teamList, gameLog };
        };

        const suitIconLabel = (suitId) => {
            const s = TRUMP_SUITS.find(x => x.id === suitId);
            return s ? `${s.icon} ${s.label}` : suitId;
        };

        const renderTourneyStats = () => {
            if (!bracketDoc) return '';
            const { teamList, gameLog } = computeTourneyStats();
            if (teamList.length === 0) return '';

            return `
            <div class="retro-card p-0 overflow-hidden">
                <button onclick="toggleTourneyStats()" class="w-full flex items-center justify-between px-5 py-4 bg-slate-900 text-white">
                    <span class="font-comic text-lg uppercase flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> Turnier-Statistik</span>
                    <i data-lucide="${showTourneyStats ? 'chevron-up' : 'chevron-down'}" class="w-5 h-5"></i>
                </button>
                ${showTourneyStats ? `
                <div class="p-5 space-y-6">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs sm:text-sm">
                            <thead>
                                <tr class="text-left text-[10px] uppercase text-slate-400 border-b-2 border-slate-200">
                                    <th class="py-2 pr-2">Team</th>
                                    <th class="py-2 px-2 text-center">Siege</th>
                                    <th class="py-2 px-2 text-center">Niederlagen</th>
                                    <th class="py-2 px-2 text-center">Punkte</th>
                                    <th class="py-2 px-2 text-center">Weis</th>
                                    <th class="py-2 pl-2">Meist gespielter Trumpf</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${teamList.map(t => {
                                    const topTrump = Object.entries(t.trumps).sort((a,b)=>b[1]-a[1])[0];
                                    return `
                                    <tr class="border-b border-slate-100">
                                        <td class="py-2 pr-2 font-bold">${t.name}</td>
                                        <td class="py-2 px-2 text-center text-green-700 font-bold">${t.wins}</td>
                                        <td class="py-2 px-2 text-center text-red-600 font-bold">${t.losses}</td>
                                        <td class="py-2 px-2 text-center font-mono">${t.points}</td>
                                        <td class="py-2 px-2 text-center font-mono">${t.weis}</td>
                                        <td class="py-2 pl-2">${topTrump ? suitIconLabel(topTrump[0]) + ` (${topTrump[1]}×)` : '—'}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div>
                        <h5 class="text-[10px] font-bold uppercase text-slate-400 mb-2">Trumpf-Verteilung pro Team</h5>
                        <div class="space-y-2">
                            ${teamList.map(t => `
                                <div class="flex items-center gap-2 flex-wrap text-xs">
                                    <span class="font-bold w-28 truncate shrink-0">${t.name}</span>
                                    ${TRUMP_SUITS.map(s => t.trumps[s.id] ? `<span class="bg-slate-100 rounded-full px-2 py-0.5 border border-slate-200">${s.icon} ${t.trumps[s.id]}×</span>` : '').join('')}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <h5 class="text-[10px] font-bold uppercase text-slate-400 mb-2">Alle Einzelspiele</h5>
                        <div class="space-y-1">
                            ${gameLog.map(g => `
                                <div class="flex items-center justify-between bg-slate-50 border border-slate-100 rounded px-3 py-2 text-xs">
                                    <span class="text-slate-400 font-mono w-24 shrink-0 truncate">${g.round}</span>
                                    <span class="flex-1 text-center">${g.nameA} <b class="font-mono">${g.totalA}</b> — <b class="font-mono">${g.totalB}</b> ${g.nameB}</span>
                                    ${g.winner ? `<span class="text-[9px] uppercase font-bold text-yellow-600 shrink-0 flex items-center gap-1"><i data-lucide="crown" class="w-3 h-3"></i>${g.winner}</span>` : '<span class="text-[9px] uppercase text-slate-300 shrink-0">läuft</span>'}
                                </div>
                            `).join('') || '<div class="text-slate-400 text-xs italic">Noch keine Spiele erfasst.</div>'}
                        </div>
                    </div>
                </div>` : ''}
            </div>`;
        };

        window.toggleTourneyStats = () => { showTourneyStats = !showTourneyStats; renderApp(); };

        window.openScoringModal = (matchId) => {
            scoringMatchId = matchId;
            scoringTrump = null;
            document.getElementById('modal-container').innerHTML = renderScoringModal();
            if (window.lucide) window.lucide.createIcons();
        };

        window.selectScoringTrump = (id) => {
            scoringTrump = id;
            // Nur die Buttons umfärben statt die ganze Maske neu zu rendern —
            // sonst gehen bereits eingetippte Punkte/Weis-Werte verloren.
            document.querySelectorAll('#modal-container .trump-mode-btn').forEach(btn => {
                const active = btn.dataset.trumpBtn === id;
                btn.classList.toggle('bg-slate-800', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('border-slate-900', active);
                btn.classList.toggle('bg-slate-50', !active);
                btn.classList.toggle('border-slate-200', !active);
                btn.classList.toggle('text-slate-500', !active);
            });
        };

        window.syncMatchPoints = (src) => {
            const inA = document.getElementById('score-pa'); const inB = document.getElementById('score-pb');
            let val = parseInt(src === 'a' ? inA.value : inB.value); if (isNaN(val)) val = 0; if (val > 157) val = 157; if (val < 0) val = 0;
            if (src === 'a') { inA.value = val; inB.value = 157 - val; } else { inB.value = val; inA.value = 157 - val; }
        };

        // Gleiche 2500-Punkte-Regel wie beim normalen "Match": Spiel endet automatisch,
        // sobald ein Team 2500 Punkte erreicht hat.
        const MATCH_TARGET_POINTS = 2500;

        window.submitMatchRound = async () => {
            const pa = parseInt(document.getElementById('score-pa').value) || 0;
            const pb = parseInt(document.getElementById('score-pb').value) || 0;
            if (pa + pb !== 157) return alert('Die Punkte von beiden Teams müssen zusammen 157 ergeben (Kartenpunkte + Stöck).');
            const wa = parseInt(document.getElementById('score-wa').value) || 0;
            const wb = parseInt(document.getElementById('score-wb').value) || 0;
            const matches = JSON.parse(JSON.stringify(bracketDoc.matches));
            const m = matches.find(x => x.id === scoringMatchId);
            if (!m) return;
            m.rounds = m.rounds || [];
            m.rounds.push({ trumpId: scoringTrump, pA: pa, pB: pb, wA: wa, wB: wb });
            await updateDoc(doc(db, TCOL.BRACKETS, currentTourneyId), { matches });
            document.getElementById('score-pa').value = '';
            document.getElementById('score-pb').value = '';
            document.getElementById('score-wa').value = '';
            document.getElementById('score-wb').value = '';

            const mults = (tourney.rules && tourney.rules.mults) || RULE_PRESETS.klassisch.mults;
            const totalA = matchSumPoints(m, mults, 'A'), totalB = matchSumPoints(m, mults, 'B');
            if (totalA >= MATCH_TARGET_POINTS || totalB >= MATCH_TARGET_POINTS) {
                alert(`${totalA >= MATCH_TARGET_POINTS ? nameAOf(m) : nameBOf(m)} hat ${MATCH_TARGET_POINTS} Punkte erreicht — Spiel wird automatisch abgeschlossen!`);
                await window.finalizeMatch(scoringMatchId, totalA >= totalB ? 'A' : 'B', true);
            }
        };

        const nameAOf = (m) => { const teamsById = {}; (bracketDoc.teams || []).forEach(tm => teamsById[tm.id] = tm); return (teamsById[m.teamA] || {}).name || 'Team A'; };
        const nameBOf = (m) => { const teamsById = {}; (bracketDoc.teams || []).forEach(tm => teamsById[tm.id] = tm); return (teamsById[m.teamB] || {}).name || 'Team B'; };

        window.finalizeMatch = async (matchId, winningSlot, skipConfirm) => {
            if (!skipConfirm && !confirm('Spiel wirklich abschliessen? Der Sieger rückt im Turnierbaum weiter.')) return;
            const matches = JSON.parse(JSON.stringify(bracketDoc.matches));
            const m = matches.find(x => x.id === matchId);
            if (!m) return;
            const winnerId = winningSlot === 'A' ? m.teamA : m.teamB;
            const loserId = winningSlot === 'A' ? m.teamB : m.teamA;
            m.winnerId = winnerId;
            if (m.winnerTo) { const [mid, slot] = m.winnerTo.split(':'); const target = matches.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = winnerId; }
            if (m.loserTo) { const [mid, slot] = m.loserTo.split(':'); const target = matches.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = loserId; }
            if (m.id === 'gf' && winningSlot === 'B') {
                if (!matches.find(x => x.id === 'gf2')) {
                    matches.push({ id: 'gf2', round: 'Entscheidungsspiel', isGrandFinal: true, winnerTo: null, loserTo: null, teamA: m.teamA, teamB: m.teamB, winnerId: null, rounds: [] });
                }
            }
            await updateDoc(doc(db, TCOL.BRACKETS, currentTourneyId), { matches });

            // Champion ermitteln & aufs Event-Dokument schreiben, damit er auch in der Übersicht sichtbar ist
            let championJustWon = false;
            if (m.id === 'gf' || m.id === 'gf2') {
                const teamsById = {}; (bracketDoc.teams || []).forEach(tm => teamsById[tm.id] = tm);
                const champion = computeChampion(matches, teamsById);
                if (champion) {
                    await updateDoc(doc(db, TCOL.TOURNEYS, currentTourneyId), { status: 'finished', championName: champion });
                    championJustWon = true;
                }
            }
            closeModal(null, true);
            if (championJustWon) { window.celebrate(true); } else { window.celebrate(false); }
        };

        window.resetTourneyTeamsAndBracket = async (tourneyId) => {
            if (!isAdmin()) return;
            if (!confirm('Teams und Turnierbaum wirklich zurücksetzen? Die Anmeldungen bleiben erhalten.')) return;
            const batch = writeBatch(db);
            tourneyRegs.forEach(r => batch.update(doc(db, TCOL.REGS, r.id), { teamNumber: null }));
            await batch.commit();
            await deleteDoc(doc(db, TCOL.BRACKETS, tourneyId)).catch(() => {});
            await updateDoc(doc(db, TCOL.TOURNEYS, tourneyId), { status: 'registration' });
        };

        // Startet mit denselben angemeldeten Teilnehmern eine neue Runde: Teams neu auslosen + neuen Baum generieren.
        window.startNewRoundSameParticipants = async (tourneyId) => {
            if (!isAdmin()) return;
            if (tourneyRegs.length < 4 || tourneyRegs.length % 2 !== 0) return alert('Mind. 4 Angemeldete (gerade Anzahl) nötig.');
            if (!confirm('Neue Runde mit den gleichen Teilnehmern starten? Der bisherige Turnierbaum wird ersetzt.')) return;

            const shuffled = [...tourneyRegs].sort(() => Math.random() - 0.5);
            const batch = writeBatch(db);
            shuffled.forEach((r, idx) => { batch.update(doc(db, TCOL.REGS, r.id), { teamNumber: Math.floor(idx / 2) }); });
            await batch.commit();

            const teamsMap = {};
            shuffled.forEach((r, idx) => { const tn = Math.floor(idx / 2); (teamsMap[tn] = teamsMap[tn] || []).push(r.name.split(' ')[0]); });
            let teamList = Object.keys(teamsMap).sort((a,b)=>a-b).map(tn => ({ id: 'team-' + tn, name: teamsMap[tn].join(' & ') }));
            teamList = [...teamList].sort(() => Math.random() - 0.5);
            const size = [4, 8, 16].find(n => teamList.length <= n) || 16;
            while (teamList.length < size) teamList.push({ id: 'BYE', name: 'Freilos' });

            const template = BRACKET_TEMPLATES2[size];
            const matches = template.map(tpl => {
                const m = { id: tpl.id, round: tpl.round, isLB: !!tpl.isLB, isGrandFinal: !!tpl.isGrandFinal, winnerTo: tpl.winnerTo || null, loserTo: tpl.loserTo || null, teamA: null, teamB: null, winnerId: null, rounds: [] };
                if (tpl.teamASeed !== undefined) m.teamA = teamList[tpl.teamASeed].id;
                if (tpl.teamBSeed !== undefined) m.teamB = teamList[tpl.teamBSeed].id;
                return m;
            });
            const resolveByes = (list) => {
                let changed = true;
                while (changed) {
                    changed = false;
                    list.forEach(m => {
                        if (!m.winnerId && m.teamA && m.teamB) {
                            let winner = null, loser = null;
                            if (m.teamA === 'BYE' && m.teamB !== 'BYE') { winner = m.teamB; loser = 'BYE'; }
                            else if (m.teamB === 'BYE' && m.teamA !== 'BYE') { winner = m.teamA; loser = 'BYE'; }
                            if (winner) {
                                m.winnerId = winner; changed = true;
                                if (m.winnerTo) { const [mid, slot] = m.winnerTo.split(':'); const target = list.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = winner; }
                                if (m.loserTo && loser !== 'BYE') { const [mid, slot] = m.loserTo.split(':'); const target = list.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = loser; }
                            }
                        }
                    });
                }
            };
            resolveByes(matches);

            await setDoc(doc(db, TCOL.BRACKETS, tourneyId), { teams: teamList.filter(t=>t.id!=='BYE'), matches, createdAt: serverTimestamp() });
            await updateDoc(doc(db, TCOL.TOURNEYS, tourneyId), { status: 'running', championName: null });
            window.location.href = 'bracket.html?id=' + tourneyId;
        };

        let NAV_MODE = 'context';
        const getContextBack = () => ({ label: tourney ? tourney.name : 'Event', href: tourney ? ('event.html?id=' + tourney.id) : 'events.html' });

        // --- SCROLL-HANDLER (Mobile-Nav Shrink) ---
        const handleScroll = () => { const nav = document.getElementById('mobile-nav'); if(nav) { if(window.scrollY > 50) nav.classList.add('translate-y-2', 'opacity-90', 'scale-95'); else nav.classList.remove('translate-y-2', 'opacity-90', 'scale-95'); } };

        // --- NEUE SEITEN-NAVIGATION ---
        // visibility: 'all' (auch Gäste), 'members' (nur eingeloggte Aktiv-/Gönner-Mitglieder), 'admin' (nur Admins)
        const NAV_ITEMS = [
            { key: 'leaderboard', label: 'Statistik',   href: 'statistik.html', icon: 'trophy',     visibility: 'all' },
            { key: 'members',     label: 'Member',      href: 'members.html',   icon: 'users',       visibility: 'all' },
            { key: 'jassevents',  label: 'Jass-Events',  href: 'events.html',   icon: 'flag',        visibility: 'all' },
            { key: 'freispiel',   label: 'Freispiel',   href: 'freispiel.html', icon: 'shuffle',    visibility: 'all' },
            { key: 'calculator',  label: 'Match',       href: 'match.html',     icon: 'calculator',  visibility: 'members' },
            { key: 'termine',     label: 'Termine',     href: 'termine.html',   icon: 'calendar',    visibility: 'members' },
            { key: 'admin',       label: 'Admin',       href: 'admin.html',     icon: 'shield',      visibility: 'admin' },
        ];
        const navItemAllowed = (i) => i.visibility === 'all' || (i.visibility === 'members' && isMember()) || (i.visibility === 'admin' && isAdmin());

        // Für die grosse Startseite (Hero + Pillen-Reihe, unverändert schön)
        const renderTopNav = (activeKey) => {
            const items = NAV_ITEMS.filter(navItemAllowed);
            return `
            <div class="hidden md:flex justify-center gap-2 mb-8 px-2 flex-wrap">
                ${items.map(i => `<a href="${i.href}" class="px-5 py-2 rounded border-2 border-black font-comic text-lg uppercase shadow-[3px_3px_0_black] hover:translate-y-[1px] hover:shadow-[1px_1px_0_black] transition-all bg-white ${activeKey===i.key?'tab-btn-active':''}">${i.label}</a>`).join('')}
            </div>`;
        };

        const renderBottomNav = (activeKey) => {
            const items = NAV_ITEMS.filter(navItemAllowed);
            return `
            <nav id="mobile-nav" class="fixed bottom-4 left-4 right-4 bg-white border-4 border-black rounded-xl shadow-[6px_6px_0_rgba(0,0,0,0.5)] px-2 py-2 flex justify-around items-center z-50 md:hidden transition-all duration-300 overflow-x-auto">
                <a href="index.html" class="flex flex-col items-center gap-1 p-2 rounded-lg transition-all shrink-0 ${activeKey==='home' ? 'bg-black text-yellow-400 transform -translate-y-1 shadow-[2px_2px_0_#d80018]' : 'text-slate-400 hover:text-slate-800'}"><i data-lucide="home" class="w-5 h-5"></i></a>
                ${items.map(i => {
                    const isActive = activeKey === i.key;
                    return `<a href="${i.href}" class="flex flex-col items-center gap-1 p-2 rounded-lg transition-all shrink-0 ${isActive ? 'bg-black text-yellow-400 transform -translate-y-1 shadow-[2px_2px_0_#d80018]' : 'text-slate-400 hover:text-slate-800'}"><i data-lucide="${i.icon}" class="w-5 h-5 ${isActive ? 'fill-current' : ''}"></i></a>`;
                }).join('')}
            </nav>`;
        };

        // Minimaler Bottom-Nav für Kontext-Seiten (Event/Turnier): nur Home + Zurück
        const renderContextBottomNav = (backInfo) => `
            <nav id="mobile-nav" class="fixed bottom-4 left-4 right-4 bg-white border-4 border-black rounded-xl shadow-[6px_6px_0_rgba(0,0,0,0.5)] px-2 py-2 flex justify-around items-center z-50 md:hidden transition-all duration-300">
                <a href="index.html" class="flex flex-col items-center gap-1 p-2 rounded-lg text-slate-400 hover:text-slate-800"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase">Hauptmenü</span></a>
                ${backInfo ? `<a href="${backInfo.href}" class="flex flex-col items-center gap-1 p-2 rounded-lg text-slate-400 hover:text-slate-800"><i data-lucide="arrow-left" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase">${backInfo.label}</span></a>` : ''}
            </nav>`;

        const renderFooter = () => `
            <footer class="text-center py-8 text-slate-400 text-xs pb-32 md:pb-8 relative z-10 font-mono">
                <div class="flex justify-center gap-4 mb-2">
                    <button onclick="setLang('de')" class="${currentLang==='de'?'text-black font-bold':'text-slate-400'}">DE</button>
                    <button onclick="setLang('en')" class="${currentLang==='en'?'text-black font-bold':'text-slate-400'}">EN</button>
                </div>
                <p class="uppercase tracking-widest">&copy; 2025 Jassgenossen Schällebur</p>
            </footer>`;

        window.toggleNavMenu = () => { document.getElementById('nav-menu-panel')?.classList.toggle('hidden'); };

        // --- JUBEL-EFFEKT (Konfetti) --- big=true für grössere Feier (z.B. Turniersieger)
        window.celebrate = (big) => {
            const colors = ['#D80018', '#fde68a', '#d97706', '#1a1a1a', '#908059', '#ffffff'];
            const count = big ? 140 : 60;
            const duration = big ? 3200 : 2000;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                const size = 6 + Math.random() * (big ? 10 : 6);
                el.style.left = (Math.random() * 100) + 'vw';
                el.style.width = size + 'px';
                el.style.height = (size * (0.4 + Math.random() * 0.6)) + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.animationDuration = (duration / 1000 * (0.7 + Math.random() * 0.6)) + 's';
                el.style.animationDelay = (Math.random() * (big ? 0.6 : 0.3)) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), duration + 800);
            }
        };

        const renderNavDropdown = (activeKey) => {
            const items = NAV_ITEMS.filter(navItemAllowed);
            return `
            <div class="relative">
                <button onclick="toggleNavMenu()" class="flex items-center gap-1.5 px-3 py-2 rounded-lg border-2 border-black bg-white font-comic text-sm uppercase shadow-[2px_2px_0_black] hover:translate-y-[1px] hover:shadow-[1px_1px_0_black] transition-all">
                    <i data-lucide="menu" class="w-4 h-4"></i><span class="hidden sm:inline">Menü</span><i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div id="nav-menu-panel" class="hidden absolute right-0 mt-2 w-56 bg-white border-2 border-black rounded-lg shadow-[4px_4px_0_black] z-50 overflow-hidden">
                    ${items.map(i => `<a href="${i.href}" class="flex items-center gap-3 px-4 py-3 text-sm font-bold border-b border-slate-100 last:border-0 hover:bg-yellow-50 ${activeKey===i.key?'bg-yellow-50 text-red-700':'text-slate-700'}"><i data-lucide="${i.icon}" class="w-4 h-4"></i>${i.label}</a>`).join('')}
                </div>
            </div>`;
        };

        // Kompakter, sticky Header für alle Seiten ausser der Startseite.
        // navMode 'full'    -> Dropdown-Menü mit allen Bereichen
        // navMode 'context' -> nur "← zurück"-Link (z.B. zurück zum Event/Turnier), kein allgemeines Menü
        const renderCompactHeader = (title, navMode, backInfo) => `
            <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b-4 border-black">
                <div class="max-w-6xl mx-auto px-3 py-2 flex items-center justify-between gap-3">
                    <a href="index.html" class="flex items-center gap-2 shrink-0 group" title="Zurück zum Hauptmenü">
                        <div class="w-9 h-9 rounded-full bg-black flex items-center justify-center overflow-hidden group-hover:scale-105 transition-transform">
                            <img src="${BG_BASE64}" onerror="this.style.display='none'" class="w-full h-full object-cover">
                        </div>
                        <span class="hidden sm:inline font-comic text-base text-slate-800 uppercase">Hauptmenü</span>
                    </a>
                    ${navMode === 'context' && backInfo ? `
                        <a href="${backInfo.href}" class="hidden sm:flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-black uppercase shrink-0">
                            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> ${backInfo.label}
                        </a>` : ''}
                    <h1 class="font-comic text-lg sm:text-2xl text-slate-900 uppercase truncate text-center flex-1">${title}</h1>
                    <div class="shrink-0 flex items-center gap-2">
                        ${navMode === 'full' ? renderNavDropdown(PAGE_KEY) : ''}
                        ${userData && userData.role !== 'pending' ? `
                            <button onclick="signOutUser()" class="w-9 h-9 rounded-full border-2 border-black overflow-hidden bg-black block" title="Abmelden">
                                <img src="${getAvatarUrl(userData)}" onerror="this.src='${URL_FALLBACK}'" class="w-full h-full object-cover">
                            </button>` : `
                            <button onclick="openLoginModal()" class="w-9 h-9 rounded-full border-2 border-black flex items-center justify-center bg-white" title="${user && user.isAnonymous ? 'Als Gast unterwegs — für Login antippen' : 'Login'}">
                                ${user && user.isAnonymous ? '<span class="text-[8px] font-bold uppercase">Gast</span>' : '<i data-lucide="key" class="w-4 h-4"></i>'}
                            </button>`}
                    </div>
                </div>
            </header>`;

        // mountPage: gemeinsamer Seitenrahmen (Header, Login/Registrierung/Pending-Gates, Nav, Footer)
        // Pro Seite gesetzt: PAGE_KEY, PAGE_TITLE, AUTO_LOGIN_MODE ('none'|'members'|'required'),
        // NAV_MODE ('full'|'context'), und bei 'context' eine Funktion getContextBack() -> {label, href}.
        const mountPage = (contentHtml) => {
            const forcedLoginNow = (AUTO_LOGIN_MODE === 'members' && !user && !window.guestMode)
                || (AUTO_LOGIN_MODE === 'required' && !user && !userData && !window.guestMode);
            const isHome = PAGE_KEY === 'home';
            const navMode = (typeof NAV_MODE !== 'undefined') ? NAV_MODE : 'full';
            const backInfo = (navMode === 'context' && typeof getContextBack === 'function') ? getContextBack() : null;
            document.getElementById('app').innerHTML = `
                ${forcedLoginNow ? renderLoginModal() : ''}
                ${(user && !user.isAnonymous && !userData) ? renderRegistration() : ''}
                ${(userData && userData.role === 'pending') ? renderPendingScreen() : (isHome ? `
                ${renderHeader()}
                <main class="max-w-6xl mx-auto -mt-8 relative z-10 min-h-screen flex flex-col">
                    ${renderTopNav(PAGE_KEY)}
                    ${contentHtml}
                    ${renderFooter()}
                </main>
                ${renderBottomNav(PAGE_KEY)}
                ` : `
                ${renderCompactHeader(PAGE_TITLE, navMode, backInfo)}
                <main class="max-w-6xl mx-auto relative z-10 min-h-screen flex flex-col pt-6">
                    ${navMode === 'context' && backInfo ? `<a href="${backInfo.href}" class="sm:hidden inline-flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-black uppercase mb-4 px-2"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> ${backInfo.label}</a>` : ''}
                    ${contentHtml}
                    ${renderFooter()}
                </main>
                ${navMode === 'full' ? renderBottomNav(PAGE_KEY) : renderContextBottomNav(backInfo)}
                `)}
            `;
            if (window.lucide) window.lucide.createIcons();
            window.removeEventListener('scroll', handleScroll);
            window.addEventListener('scroll', handleScroll);
        };

        // --- GEMEINSAME ACTIONS: LOGIN / REGISTRIERUNG / SESSION ---
        window.openLoginModal = () => { document.getElementById('modal-container').innerHTML = renderLoginModal(); if (window.lucide) window.lucide.createIcons(); };
        window.closeModal = (e, force) => { if (force || e.target.id === 'modal-container') document.getElementById('modal-container').innerHTML = ''; };
        window.setLang = (l) => { currentLang = l; renderApp(); };
        window.setRegRole = (r) => { registrationRole = r; renderApp(); };

        window.loginGoogle = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); closeModal(null,true); } catch(e) { alert("Login Error: " + e.message); } };

        window.loginGuestAndRedirect = async () => {
            window.guestMode = true;
            closeModal(null,true);
            renderApp();
        };

        window.signOutUser = async () => { await signOut(auth); userData = null; window.guestMode = false; window.location.reload(); };

                window.selectRegAvatar = (url) => { selectedRegAvatar = url; renderApp(); };
        window.completeRegistration = async () => {
            const name = document.getElementById('reg-name').value;
            const role = registrationRole;
            if(!name) return;
            const isAdminUser = user.email && ADMIN_EMAILS.includes(user.email);
            let roleKey = '';
            const legacy = LEGACY_DEBTS.find(l => (user.email && l.email && user.email.toLowerCase() === l.email.toLowerCase()) || (name && name.toLowerCase().includes(l.name.toLowerCase())));
            if(legacy) roleKey = legacy.roleKey;
            await setDoc(doc(db, COLLECTIONS.USERS, user.uid), { id: user.uid, name, role: isAdminUser ? 'admin' : 'pending', roleName: role === 'active' ? 'Aktivmitglied' : 'Gönner', avatar: selectedRegAvatar || user.photoURL || '', joined: serverTimestamp(), email: user.email || '', roleKey: roleKey });
        };


        const renderApp = () => {
            mountPage(renderTourneyBracket());
            if (scoringMatchId && bracketDoc) {
                const mc = document.getElementById('modal-container');
                if (mc) { mc.innerHTML = renderScoringModal(); if (window.lucide) window.lucide.createIcons(); }
            }
        };


        // --- INIT ---
        const startApp = async () => {
            if(!firebaseConfig.apiKey || firebaseConfig.apiKey === '*') return document.getElementById('app').innerHTML = "<div class='p-10 text-center font-comic text-red-600'><h1>Error: Firebase Config fehlt!</h1></div>";
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            // Gäste bekommen automatisch eine anonyme Firebase-Session (stabile uid),
            // damit Firestore-Regeln "request.auth != null" verlangen können statt komplett offen zu sein,
            // und damit z.B. eigene Turnierbaum-Resultate später der eigenen Anmeldung zugeordnet werden können.
            // Anonyme Gast-Anmeldung: NUR wenn nach dem ersten echten Auth-Check wirklich niemand eingeloggt ist.
            // (auth.currentUser ist direkt nach getAuth() oft noch null, auch wenn im Hintergrund eine echte
            // Google-Session wiederhergestellt wird — das hat vorher dazu geführt, dass eingeloggte Member
            // teils in eine anonyme Session "verschoben" wurden. Darum zuerst auf onAuthStateChanged warten.)
            let authFirstCheckDone = false;

            onSnapshot(query(collection(db, COLLECTIONS.USERS)), sn => {
                users = sn.docs.map(d=>({id:d.id, ...d.data()}));
                if(user) userData = users.find(u => u.id === user.uid) || userData;
                if(userData?.role === 'admin') pendingUsers = users.filter(u => u.role === 'pending');
                renderApp();
            });

            currentTourneyId = new URLSearchParams(window.location.search).get('id');
            if (currentTourneyId) {
                onSnapshot(doc(db, TCOL.TOURNEYS, currentTourneyId), sn => { tourney = sn.exists() ? { id: sn.id, ...sn.data() } : null; renderApp(); });
                onSnapshot(query(collection(db, TCOL.REGS), where('tourneyId', '==', currentTourneyId)), sn => { tourneyRegs = sn.docs.map(d=>({id:d.id, ...d.data()})); renderApp(); });
                onSnapshot(doc(db, TCOL.BRACKETS, currentTourneyId), sn => { bracketDoc = sn.exists() ? sn.data() : null; renderApp(); });
            }

            onAuthStateChanged(auth, async (u) => {
                user = u;
                if (!authFirstCheckDone) {
                    authFirstCheckDone = true;
                    if (!u) {
                        try { await signInAnonymously(auth); } catch(e) { console.error('Anonyme Anmeldung fehlgeschlagen:', e); }
                        return; // signInAnonymously löst onAuthStateChanged erneut aus -> dort wird gerendert
                    }
                }
                if (user && !user.isAnonymous) {
                    const userRef = doc(db, COLLECTIONS.USERS, user.uid);
                    const snap = await getDoc(userRef);
                    if (!snap.exists()) { userData = null; renderApp(); }
                    else { userData = snap.data(); if (user.email && ADMIN_EMAILS.includes(user.email) && userData.role !== 'admin') { await updateDoc(userRef, { role: 'admin' }); } renderApp(); }
                } else { userData = null; renderApp(); }
                
                renderApp();
            });
        };
        startApp();

    </script>
</body>
</html>
