        :root {

            --paper-bg: #F3F0E6;

            --gold-base: #908059;
        }

            color: var(--ink-black);
            font-family: 'Roboto Condensed', sans-serif;

        }

            font-family: 'Bangers', cursive;

        }

        .retro-card {
            background-color: #fff;
            border: 3px solid var(--ink-black);
            border-radius: 12px;
            box-shadow: 6px 6px 0px rgba(0,0,0,1);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .retro-card:active { 
            transform: translate(2px, 2px); 
            box-shadow: 4px 4px 0px rgba(0,0,0,1); 
        }

        .retro-btn {
            background-color: var(--swiss-red);
            color: white;
            border: 3px solid var(--ink-black);
            border-radius: 8px;
            font-family: 'Bangers', cursive;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
            transition: transform 0.1s;
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .retro-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 2px 2px 0px rgba(0,0,0,1); 
        }
        
        .retro-btn-secondary { 
            background-color: var(--gold-base); 
            color: var(--ink-black); 
        }
        
        .retro-btn-outline { 
            background-color: white; 
            color: black; 
        }
        
        .retro-btn-success { 
            background-color: #16a34a; 
            color: white; 
        }
        
        .retro-input {
            background-color: #fff;
            border: 3px solid var(--ink-black);
            border-radius: 8px;
            font-family: 'Bangers', cursive;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            outline: none;
        }
        
        .retro-input:focus { 
            border-color: var(--swiss-red); 
        }

        .header-pattern-container {
            position: absolute; 
            inset: 0; 
            z-index: 0;
            background-color: var(--gold-base);
            border-bottom: 4px solid var(--ink-black);
        }
        
        .header-pattern-img {
            position: absolute; 
            inset: 0; 
            z-index: 0;
            background-repeat: repeat;
            background-size: 60px 60px;
            opacity: 0.2;
            filter: brightness(10) grayscale(60%);
        }

        .avatar-card-frame {
            width: 70px; 
            height: 100px; 
            border: 3px solid var(--ink-black); 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
            box-shadow: 2px 2px 0px rgba(0,0,0,1);
        }
        
        .avatar-img-pinned {
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-position: bottom;
            transform: translateY(14%) scale(1.2); 
            transform-origin: bottom center;
        }
        
        .tab-btn-active {
            background-color: var(--gold-base) !important;
            color: var(--ink-black) !important;
            transform: translateY(-4px);
            box-shadow: 2px 2px 0px #d80018 !important;
        }

        .modal-overlay { 
            background-color: rgba(26, 26, 26, 0.95); 
            backdrop-filter: blur(4px); 
        }
        
        .stamp-definitiv {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 4px solid #166534; 
            color: #166534; 
            padding: 5px 10px;
            font-family: 'Bangers', cursive; 
            font-size: 2rem; 
            text-transform: uppercase;
            opacity: 0.8; 
            pointer-events: none; 
            mix-blend-mode: multiply; 
            z-index: 10;
        }

        .animate-in { 
            animation: animateIn 0.3s ease-out forwards; 
        }
        
        @keyframes animateIn { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }
        
        input[type=range] { 
            -webkit-appearance: none; 
            appearance: none; 
            width: 100%; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            appearance: none; 
            height: 24px; 
            width: 24px; 
            border-radius: 50%; 
            background: #D80018; 
            border: 2px solid black; 
            cursor: pointer; 
            margin-top: -10px; 
        }
        
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 6px; 
            cursor: pointer; 
            background: #e2e8f0; 
            border-radius: 3px; 
            border: 1px solid #94a3b8; 
        }

        /* BRACKET */
        .bracket-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .bracket-col { min-width: 220px; }
        .bracket-match { background:#fff; }
        .bracket-connector { position:relative; }
    </style>

            const docRef = await addDoc(collection(db, COLLECTIONS.EVENTS), {
                date: new Date(d+'T'+t1), timeFrom: t1, timeTo: t2, location: loc, hostId: hostId,

            const body = `${t('emailBodyNew')}\n\nDatum: ${new Date(d).toLocaleDateString('de-CH')}\nZeit: ${t1} Uhr\nOrt: ${loc} (${t('host')}: ${hostName})\n\n`;

        window.updateEventStatus = async (eid, status) => {
            const ref = doc(db, COLLECTIONS.EVENTS, eid);

            let attendees = data.attendees || [];
            let declined = data.declined || [];
            attendees = attendees.filter(id => id !== user.uid);
            declined = declined.filter(id => id !== user.uid);
            if (status === 'join') attendees.push(user.uid);
            if (status === 'decline') declined.push(user.uid);
            
            let newStatus = 'poll';
            let justConfirmed = false;
            if (attendees.length >= 4) {
                if (data.status !== 'confirmed') justConfirmed = true;

                newStatus = 'poll';
            }

            await updateDoc(ref, { attendees, declined, status: newStatus });
            if(document.getElementById('modal-container').innerHTML !== '') { window.openEventDetails(eid); }

            if(justConfirmed) {
                const baseUrl = window.location.href.split('?')[0];
                const eventLink = `${baseUrl}?eid=${eid}`;
                const dObj = data.date.toDate();
                const dStr = dObj.toLocaleDateString('de-CH');
                const participantEmails = users.filter(u => attendees.includes(u.id) && u.email).map(u => u.email);
                const subject = t('emailSubjectConfirm') + `: ${dStr}`;
                const body = `${t('emailBodyConfirm')}\n\nDatum: ${dStr}\nStart: ${data.timeFrom} Uhr\nLocation: ${data.location}\n\n`;
                await sendSystemEmail(participantEmails, subject, body, eventLink);

        };

        // --- CALCULATOR & OTHER ACTIONS ---
        window.toggleTeamSelection = (pid, team) => {
            const other = team === 1 ? 2 : 1;
            const myArr = calculatorState[`team${team}`];
            const otherArr = calculatorState[`team${other}`];
            if (myArr.includes(pid)) calculatorState[`team${team}`] = myArr.filter(id => id !== pid);
            else if (!otherArr.includes(pid) && myArr.length < 2) calculatorState[`team${team}`].push(pid);
            renderApp();
        };
        window.startCalculatorGame = () => { calculatorState.activeStep = 'play'; calculatorState.rounds = []; calculatorState.penalties = []; calculatorState.selectedTrump = 'eichel'; renderApp(); };
        window.selectTrump = (id) => { calculatorState.selectedTrump = id; renderApp(); };
        window.updateFromSlider = (val) => { document.getElementById('input-points-a').value = val; calculatePoints('a'); };
        window.calculatePoints = (src) => {
            const inA = document.getElementById('input-points-a'); const inB = document.getElementById('input-points-b'); const slider = document.getElementById('slider-points');
            let val = parseInt(src==='a'?inA.value:inB.value); if(isNaN(val)) val = 0; if (val > 157) val = 157; 
            if (src==='a') { inA.value = val; inB.value = 157 - val; if(slider) slider.value = val; } else { inB.value = val; inA.value = 157 - val; if(slider) slider.value = 157 - val; }
        };
        window.submitRound = () => {
            const pA_in = parseInt(document.getElementById('input-points-a').value) || 0; const pB_in = parseInt(document.getElementById('input-points-b').value) || 0;
            const wA = parseInt(document.getElementById('input-weis-a').value) || 0; const wB = parseInt(document.getElementById('input-weis-b').value) || 0;
            if (pA_in + pB_in !== 157) return alert("Punkte müssen 157 ergeben!");
            const trump = TRUMP_MODES.find(t => t.id === calculatorState.selectedTrump);
            calculatorState.rounds.push({ pA: pA_in, pB: pB_in, wA: wA, wB: wB, mult: trump ? trump.mult : 1, trumpId: calculatorState.selectedTrump });
            document.getElementById('input-points-a').value = ''; document.getElementById('input-points-b').value = '157'; document.getElementById('input-weis-a').value = ''; document.getElementById('input-weis-b').value = ''; document.getElementById('slider-points').value = 0;
            checkGameEnd(); renderApp();
        };
        window.undoLastRound = () => { if(calculatorState.rounds.length > 0) { calculatorState.rounds.pop(); renderApp(); } };
        window.editRound = (index) => {
            const r = calculatorState.rounds[index];
            setTimeout(() => { document.getElementById('input-points-a').value = r.pA; document.getElementById('input-points-b').value = r.pB; document.getElementById('input-weis-a').value = r.wA || ''; document.getElementById('input-weis-b').value = r.wB || ''; if(document.getElementById('slider-points')) document.getElementById('slider-points').value = r.pA; }, 50);
            calculatorState.selectedTrump = r.trumpId; calculatorState.rounds.splice(index, 1); renderApp();
        };
        const checkGameEnd = () => {
            const sumPts = (tIdx) => calculatorState.rounds.reduce((acc, r) => { const cardPts = tIdx === 1 ? r.pA : r.pB; const val = cardPts === 157 ? 257 : cardPts; const weis = tIdx === 1 ? r.wA : r.wB; return acc + (val * r.mult) + (weis * r.mult); }, 0);
            const s1 = sumPts(1), s2 = sumPts(2);
            if (s1 >= 2500 || s2 >= 2500) {
                calculatorState.activeStep = 'finish'; calculatorState.winnerTeam = s1 >= 2500 ? 1 : 2; calculatorState.penalties = []; 
                const losingTeamId = s1 >= 2500 ? 2 : 1; const losingTeamScore = s1 >= 2500 ? s2 : s1; const losingMembers = calculatorState[`team${losingTeamId}`];
                losingMembers.forEach(uid => { calculatorState.penalties.push({ playerId: uid, amount: 2, reason: 'Verloren (Spiel)' }); });
                if(losingTeamScore < 1500) { losingMembers.forEach(uid => { calculatorState.penalties.push({ playerId: uid, amount: 1, reason: 'Berg (Schneider)' }); }); }
                calculatorState.rounds.forEach(r => { if (r.pA === 0) { calculatorState.team1.forEach(uid => calculatorState.penalties.push({ playerId: uid, amount: 1, reason: 'Match kassiert' })); } if (r.pB === 0) { calculatorState.team2.forEach(uid => calculatorState.penalties.push({ playerId: uid, amount: 1, reason: 'Match kassiert' })); } });
            }
        };
        window.saveCalculatedGame = async () => {
            const batch = writeBatch(db);
            calculatorState.penalties.forEach(p => { batch.set(doc(collection(db, COLLECTIONS.GAMES)), { playerId: p.playerId, points: p.amount, reason: p.reason, timestamp: serverTimestamp(), type: 'game-penalty', season: currentSeasonId, paid: false }); });
            const winners = calculatorState[`team${calculatorState.winnerTeam}`];
            winners.forEach(uid => { batch.set(doc(collection(db, COLLECTIONS.GAMES)), { playerId: uid, points: 1, type: 'game-win', timestamp: serverTimestamp(), season: currentSeasonId }); });

        window.payDebt = async (uid) => { if(!confirm("Schulden als BEZAHLT markieren?")) return; const unpaid = games.filter(g => g.playerId === uid && g.type === 'game-penalty' && !g.paid); const batch = writeBatch(db); unpaid.forEach(g => batch.update(doc(db, COLLECTIONS.GAMES, g.id), { paid: true, paidDate: serverTimestamp() })); await batch.commit(); };
        window.abortGame = () => { if(confirm(t('gameAbort')+"?")) { calculatorState.activeStep='setup'; calculatorState.team1=[]; calculatorState.team2=[]; renderApp(); }};

        window.handleDeleteEvent = async (id) => { if(!confirm(t('deleteEvent')+"?")) return; await deleteDoc(doc(db, COLLECTIONS.EVENTS, id)); closeModal(null,true); };

        // --- GENERATIONEN JASS: REGISTRIERUNG & TEAM-RANDOMISER ---
        window.registerGenJass = async () => {

            if (already) return alert(t('genjassAlreadyIn'));

        // --- TURNIERBAUM: DOPPEL-K.O. ---
        window.generateBracket = async () => {
            const teamed = genJassRegs.filter(r => r.teamNumber != null);
            const teamsMap = {};
            teamed.forEach(r => { (teamsMap[r.teamNumber] = teamsMap[r.teamNumber] || []).push(r.name.split(' ')[0]); });
            let teamList = Object.keys(teamsMap).sort((a,b)=>a-b).map(tn => ({ id: 'team-' + tn, name: teamsMap[tn].join(' & ') }));
            if (teamList.length < 2) return alert(t('bracketNeedTeams'));
            if (!confirm(t('bracketGenerate') + '?')) return;

            teamList = [...teamList].sort(() => Math.random() - 0.5);
            const size = teamList.length <= 4 ? 4 : 8;
            while (teamList.length < size) teamList.push({ id: 'BYE', name: t('bracketBye') });

            const template = BRACKET_TEMPLATES[size];
            const matches = template.map(tpl => {
                const m = { id: tpl.id, round: tpl.round, isLB: !!tpl.isLB, isGrandFinal: !!tpl.isGrandFinal, winnerTo: tpl.winnerTo || null, loserTo: tpl.loserTo || null, teamA: null, teamB: null, winnerId: null };
                if (tpl.teamASeed !== undefined) m.teamA = teamList[tpl.teamASeed].id;
                if (tpl.teamBSeed !== undefined) m.teamB = teamList[tpl.teamBSeed].id;
                return m;
            });

            // Freilose sofort auflösen (Bye gewinnt automatisch weiter)
            const resolveByes = (list) => {
                let changed = true;
                while (changed) {
                    changed = false;
                    list.forEach(m => {
                        if (!m.winnerId && m.teamA && m.teamB) {
                            let winner = null, loser = null;
                            if (m.teamA === 'BYE' && m.teamB !== 'BYE') { winner = m.teamB; loser = 'BYE'; }
                            else if (m.teamB === 'BYE' && m.teamA !== 'BYE') { winner = m.teamA; loser = 'BYE'; }
                            if (winner) {
                                m.winnerId = winner;
                                changed = true;
                                if (m.winnerTo) { const [mid, slot] = m.winnerTo.split(':'); const target = list.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = winner; }
                                if (m.loserTo && loser !== 'BYE') { const [mid, slot] = m.loserTo.split(':'); const target = list.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = loser; }
                            }
                        }
                    });
                }
            };
            resolveByes(matches);

            await setDoc(doc(db, COLLECTIONS.BRACKET, 'current'), { teams: teamList.filter(t=>t.id!=='BYE'), matches, createdAt: serverTimestamp() });
        };

        window.submitBracketResult = async (matchId, winningSlot) => {
            if (!bracketData) return;
            const matches = JSON.parse(JSON.stringify(bracketData.matches));
            const m = matches.find(x => x.id === matchId);
            if (!m) return;
            const winnerId = winningSlot === 'A' ? m.teamA : m.teamB;
            const loserId = winningSlot === 'A' ? m.teamB : m.teamA;
            m.winnerId = winnerId;

            if (m.winnerTo) { const [mid, slot] = m.winnerTo.split(':'); const target = matches.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = winnerId; }
            if (m.loserTo) { const [mid, slot] = m.loserTo.split(':'); const target = matches.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = loserId; }

            // Grand Final Logik: wenn LB-Champion (Slot B) gewinnt, Entscheidungsspiel (gf2) erzeugen
            if (m.id === 'gf' && winningSlot === 'B') {
                if (!matches.find(x => x.id === 'gf2')) {
                    matches.push({ id: 'gf2', round: t('bracketGF2'), isGrandFinal: true, winnerTo: null, loserTo: null, teamA: m.teamA, teamB: m.teamB, winnerId: null });
                }
            }

            await updateDoc(doc(db, COLLECTIONS.BRACKET, 'current'), { matches });
        };

        window.resetBracket = async () => { if(!confirm(t('bracketReset')+'?')) return; await deleteDoc(doc(db, COLLECTIONS.BRACKET, 'current')); };

        // (handleScroll wird zentral in nav_new definiert)


        const renderApp = () => {
            mountPage(renderMembers())
        };


        // --- INIT ---
        const startApp = async () => {
            if(!firebaseConfig.apiKey || firebaseConfig.apiKey === '*') return document.getElementById('app').innerHTML = "<div class='p-10 text-center font-comic text-red-600'><h1>Error: Firebase Config fehlt!</h1></div>";
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            onSnapshot(query(collection(db, COLLECTIONS.USERS)), sn => {
                users = sn.docs.map(d=>({id:d.id, ...d.data()}));
                if(user) userData = users.find(u => u.id === user.uid) || userData;
                if(userData?.role === 'admin') pendingUsers = users.filter(u => u.role === 'pending');
                renderApp();
            });
            onSnapshot(query(collection(db, COLLECTIONS.GAMES), orderBy('timestamp', 'desc')), sn => { games = sn.docs.map(d=>({id:d.id, ...d.data()})); renderApp(); });
            onSnapshot(doc(db, COLLECTIONS.SETTINGS, 'config'), sn => { if(sn.exists()) currentSeasonId = sn.data().currentSeason || '2025'; renderApp(); });

            onAuthStateChanged(auth, async (u) => {
                user = u;
                if (user && !user.isAnonymous) {
                    const userRef = doc(db, COLLECTIONS.USERS, user.uid);
                    const snap = await getDoc(userRef);
                    if (!snap.exists()) { userData = null; renderApp(); }
                    else { userData = snap.data(); if (user.email && ADMIN_EMAILS.includes(user.email) && userData.role !== 'admin') { await updateDoc(userRef, { role: 'admin' }); } renderApp(); }
                } else { userData = null; renderApp(); }
                
            });
        };
        startApp();

    </script>
</body>
</html>
