        }

            color: var(--ink-black);

        .retro-card {
            background-color: #fff;
            border: 3px solid var(--ink-black);
            border-radius: 12px;
            box-shadow: 6px 6px 0px rgba(0,0,0,1);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .retro-card:active { 
            transform: translate(2px, 2px); 
            box-shadow: 4px 4px 0px rgba(0,0,0,1); 
        }

        .retro-btn {
            background-color: var(--swiss-red);
            color: white;
            border: 3px solid var(--ink-black);
            border-radius: 8px;
            font-family: 'Bangers', cursive;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
            transition: transform 0.1s;
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .retro-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 2px 2px 0px rgba(0,0,0,1); 
        }
        
        .retro-btn-secondary { 
            background-color: var(--gold-base); 
            color: var(--ink-black); 
        }
        
        .retro-btn-outline { 
            background-color: white; 
            color: black; 
        }
        
        .retro-btn-success { 
            background-color: #16a34a; 
            color: white; 
        }
        
        .retro-input {
            background-color: #fff;
            border: 3px solid var(--ink-black);
            border-radius: 8px;
            font-family: 'Bangers', cursive;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            outline: none;
        }
        
        .retro-input:focus { 
            border-color: var(--swiss-red); 
        }

        .header-pattern-container {
            position: absolute; 
            inset: 0; 
            z-index: 0;
            background-color: var(--gold-base);
            border-bottom: 4px solid var(--ink-black);
        }
        
        .header-pattern-img {
            position: absolute; 
            inset: 0; 
            z-index: 0;
            background-repeat: repeat;
            background-size: 60px 60px;
            opacity: 0.2;
            filter: brightness(10) grayscale(60%);
        }

        .avatar-card-frame {
            width: 70px; 
            height: 100px; 
            border: 3px solid var(--ink-black); 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
            box-shadow: 2px 2px 0px rgba(0,0,0,1);
        }
        
        .avatar-img-pinned {
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-position: bottom;
            transform: translateY(14%) scale(1.2); 
            transform-origin: bottom center;
        }
        
        .tab-btn-active {
            background-color: var(--gold-base) !important;
            color: var(--ink-black) !important;
            transform: translateY(-4px);
            box-shadow: 2px 2px 0px #d80018 !important;
        }

        .modal-overlay { 
            background-color: rgba(26, 26, 26, 0.95); 
            backdrop-filter: blur(4px); 
        }
        
        .stamp-definitiv {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 4px solid #166534; 
            color: #166534; 
            padding: 5px 10px;
            font-family: 'Bangers', cursive; 
            font-size: 2rem; 
            text-transform: uppercase;
            opacity: 0.8; 
            pointer-events: none; 
            mix-blend-mode: multiply; 
            z-index: 10;
        }

        .animate-in { 
            animation: animateIn 0.3s ease-out forwards; 
        }
        
        @keyframes animateIn { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }
        
        input[type=range] { 
            -webkit-appearance: none; 
            appearance: none; 
            width: 100%; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            appearance: none; 
            height: 24px; 
            width: 24px; 
            border-radius: 50%; 
            background: #D80018; 
            border: 2px solid black; 
            cursor: pointer; 
            margin-top: -10px; 
        }
        
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 6px; 
            cursor: pointer; 
            background: #e2e8f0; 
            border-radius: 3px; 
            border: 1px solid #94a3b8;

        .bracket-connector { position:relative; }

                    ${!canDraw ? '<p class="text-[10px] text-slate-400 mb-3">Für die Auslosung braucht es mind. 4 Angemeldete (gerade Anzahl).</p>' : ''}

                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <button onclick="generateTourneyBracket('${tourney.id}')" ${teamCount < 2 ? 'disabled' : ''} class="retro-btn py-2 text-xs ${teamCount < 2 ? '!bg-slate-200 !text-slate-400 !border-slate-300 !shadow-none' : ''}">Turnier starten</button>
                        <button onclick="setTourneyStatus('${tourney.id}','finished')" class="retro-btn-secondary retro-btn py-2 text-xs">Als beendet markieren</button>
                    </div>

                    <div class="border-t border-slate-200 pt-3 flex justify-between">
                        <button onclick="resetTourneyTeamsAndBracket('${tourney.id}')" class="text-red-500 text-xs font-bold hover:underline">Teams & Turnierbaum zurücksetzen</button>
                        <button onclick="deleteTourney('${tourney.id}')" class="text-red-500 text-xs font-bold hover:underline">Event löschen</button>
                    </div>
                </div>` : ''}
            </div>`;
        };

        window.registerSelfForTourney = async (tourneyId) => {
            const nameInput = document.getElementById('reg-self-name');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) return alert('Bitte Namen eingeben.');
            const already = tourneyRegs.find(r => (user && r.uid === user.uid) || r.name.toLowerCase() === name.toLowerCase());
            if (already) return alert('Diese Person ist bereits angemeldet.');
            await addDoc(collection(db, TCOL.REGS), {
                tourneyId, uid: user ? user.uid : null, name,
                avatar: (userData && userData.avatar) || (user && user.photoURL) || '',
                isGuest: !user, teamNumber: null, timestamp: serverTimestamp(),
            });
        };

        window.adminAddGuestToTourney = async (tourneyId) => {
            if (!isAdmin()) return;
            const input = document.getElementById('admin-guest-name');
            const name = input ? input.value.trim() : '';
            if (!name) return;
            await addDoc(collection(db, TCOL.REGS), {
                tourneyId, uid: null, name, avatar: '', isGuest: true, teamNumber: null, timestamp: serverTimestamp(),
            });
            input.value = '';
        };

        window.removeTourneyReg = async (regId) => {
            if (!isAdmin()) return;
            if (!confirm('Anmeldung entfernen?')) return;
            await deleteDoc(doc(db, TCOL.REGS, regId));
        };

        window.copyTourneyLink = () => {
            const el = document.getElementById('tourney-share-url');
            el.select();
            navigator.clipboard?.writeText(el.value);
            alert('Link kopiert!');
        };

        window.setTourneyStatus = async (tourneyId, status) => {
            if (!isAdmin()) return;
            await updateDoc(doc(db, TCOL.TOURNEYS, tourneyId), { status });
        };

        window.drawTourneyTeams = async (tourneyId) => {
            if (!isAdmin()) return;
            if (tourneyRegs.length < 4 || tourneyRegs.length % 2 !== 0) return alert('Mind. 4 Angemeldete (gerade Anzahl) nötig.');
            if (!confirm('Teams neu auslosen?')) return;
            const shuffled = [...tourneyRegs].sort(() => Math.random() - 0.5);
            const batch = writeBatch(db);
            shuffled.forEach((r, idx) => { batch.update(doc(db, TCOL.REGS, r.id), { teamNumber: Math.floor(idx / 2) }); });
            await batch.commit();
        };

        window.generateTourneyBracket = async (tourneyId) => {
            if (!isAdmin()) return;
            const teamed = tourneyRegs.filter(r => r.teamNumber != null);
            const teamsMap = {};
            teamed.forEach(r => { (teamsMap[r.teamNumber] = teamsMap[r.teamNumber] || []).push(r.name.split(' ')[0]); });
            let teamList = Object.keys(teamsMap).sort((a,b)=>a-b).map(tn => ({ id: 'team-' + tn, name: teamsMap[tn].join(' & ') }));
            if (teamList.length < 2) return alert('Zu wenig Teams. Bitte zuerst Teams auslosen.');
            if (!confirm('Turnier jetzt starten? Der Turnierbaum wird erstellt.')) return;

            teamList = [...teamList].sort(() => Math.random() - 0.5);
            const size = [4, 8, 16].find(n => teamList.length <= n) || 16;
            while (teamList.length < size) teamList.push({ id: 'BYE', name: 'Freilos' });

            const template = BRACKET_TEMPLATES2[size];
            const matches = template.map(tpl => {
                const m = { id: tpl.id, round: tpl.round, isLB: !!tpl.isLB, isGrandFinal: !!tpl.isGrandFinal, winnerTo: tpl.winnerTo || null, loserTo: tpl.loserTo || null, teamA: null, teamB: null, winnerId: null, rounds: [] };
                if (tpl.teamASeed !== undefined) m.teamA = teamList[tpl.teamASeed].id;
                if (tpl.teamBSeed !== undefined) m.teamB = teamList[tpl.teamBSeed].id;
                return m;
            });

            const resolveByes = (list) => {
                let changed = true;
                while (changed) {
                    changed = false;
                    list.forEach(m => {
                        if (!m.winnerId && m.teamA && m.teamB) {
                            let winner = null, loser = null;
                            if (m.teamA === 'BYE' && m.teamB !== 'BYE') { winner = m.teamB; loser = 'BYE'; }
                            else if (m.teamB === 'BYE' && m.teamA !== 'BYE') { winner = m.teamA; loser = 'BYE'; }
                            if (winner) {
                                m.winnerId = winner; changed = true;
                                if (m.winnerTo) { const [mid, slot] = m.winnerTo.split(':'); const target = list.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = winner; }
                                if (m.loserTo && loser !== 'BYE') { const [mid, slot] = m.loserTo.split(':'); const target = list.find(x => x.id === mid); if (target) target[slot === 'A' ? 'teamA' : 'teamB'] = loser; }
                            }
                        }
                    });
                }
            };
            resolveByes(matches);

            await setDoc(doc(db, TCOL.BRACKETS, tourneyId), { teams: teamList.filter(t=>t.id!=='BYE'), matches, createdAt: serverTimestamp() });
            await updateDoc(doc(db, TCOL.TOURNEYS, tourneyId), { status: 'running' });
            window.location.href = 'bracket.html?id=' + tourneyId;
        };


        window.deleteTourney = async (tourneyId) => {
            if (!isAdmin()) return;
            if (!confirm('Event inkl. aller Anmeldungen und des Turnierbaums komplett löschen?')) return;
            const batch = writeBatch(db);
            tourneyRegs.forEach(r => batch.delete(doc(db, TCOL.REGS, r.id)));
            batch.delete(doc(db, TCOL.TOURNEYS, tourneyId));
            await batch.commit();
            await deleteDoc(doc(db, TCOL.BRACKETS, tourneyId)).catch(() => {});
            window.location.href = 'events.html';
        };

        window.resetTourneyTeamsAndBracket = async (tourneyId) => {
            if (!isAdmin()) return;
            if (!confirm('Teams und Turnierbaum wirklich zurücksetzen? Die Anmeldungen bleiben erhalten.')) return;
            const batch = writeBatch(db);
            tourneyRegs.forEach(r => batch.update(doc(db, TCOL.REGS, r.id), { teamNumber: null }));
            await batch.commit();
            await deleteDoc(doc(db, TCOL.BRACKETS, tourneyId)).catch(() => {});
            await updateDoc(doc(db, TCOL.TOURNEYS, tourneyId), { status: 'registration' });
        };

        // --- SCROLL-HANDLER (Mobile-Nav Shrink) ---
        const handleScroll = () => { const nav = document.getElementById('mobile-nav'); if(nav) { if(window.scrollY > 50) nav.classList.add('translate-y-2', 'opacity-90', 'scale-95'); else nav.classList.remove('translate-y-2', 'opacity-90', 'scale-95'); } };

        // --- NEUE SEITEN-NAVIGATION (ersetzt Tab-Switching) ---
        const NAV_ITEMS = [
            { key: 'leaderboard', label: 'Statistik', href: 'statistik.html', icon: 'trophy', membersOnly: false },
            { key: 'calculator',  label: 'Match',     href: 'match.html',     icon: 'calculator', membersOnly: false },
            { key: 'members',     label: 'Member',    href: 'members.html',  icon: 'users', membersOnly: false },
            { key: 'termine',     label: 'Termine',   href: 'termine.html',  icon: 'calendar', membersOnly: false },
            { key: 'jassevents',  label: 'Jass-Events', href: 'events.html', icon: 'flag', membersOnly: false },
            { key: 'admin',       label: 'Admin',     href: 'admin.html',    icon: 'shield', membersOnly: true },
        ];

        const renderTopNav = (activeKey) => {
            const items = NAV_ITEMS.filter(i => !i.membersOnly || isAdmin());
            return `
            <div class="hidden md:flex justify-center gap-2 -mt-4 relative z-20 mb-8 px-2 flex-wrap">
                <a href="index.html" class="px-5 py-2 rounded border-2 border-black font-comic text-lg uppercase shadow-[3px_3px_0_black] hover:translate-y-[1px] hover:shadow-[1px_1px_0_black] transition-all bg-white" title="Home"><i data-lucide="home" class="w-5 h-5"></i></a>
                ${items.map(i => `<a href="${i.href}" class="px-5 py-2 rounded border-2 border-black font-comic text-lg uppercase shadow-[3px_3px_0_black] hover:translate-y-[1px] hover:shadow-[1px_1px_0_black] transition-all bg-white ${activeKey===i.key?'tab-btn-active':''}">${i.label}</a>`).join('')}
            </div>`;
        };

        const renderBottomNav = (activeKey) => {
            const items = NAV_ITEMS.filter(i => !i.membersOnly || isAdmin());
            return `
            <nav id="mobile-nav" class="fixed bottom-4 left-4 right-4 bg-white border-4 border-black rounded-xl shadow-[6px_6px_0_rgba(0,0,0,0.5)] px-2 py-2 flex justify-around items-center z-50 md:hidden transition-all duration-300 overflow-x-auto">
                <a href="index.html" class="flex flex-col items-center gap-1 p-2 rounded-lg transition-all shrink-0 text-slate-400 hover:text-slate-800"><i data-lucide="home" class="w-5 h-5"></i></a>
                ${items.map(i => {
                    const isActive = activeKey === i.key;
                    return `<a href="${i.href}" class="flex flex-col items-center gap-1 p-2 rounded-lg transition-all shrink-0 ${isActive ? 'bg-black text-yellow-400 transform -translate-y-1 shadow-[2px_2px_0_#d80018]' : 'text-slate-400 hover:text-slate-800'}"><i data-lucide="${i.icon}" class="w-5 h-5 ${isActive ? 'fill-current' : ''}"></i></a>`;
                }).join('')}
            </nav>`;
        };

        const renderFooter = () => `
            <footer class="text-center py-8 text-slate-400 text-xs pb-32 md:pb-8 relative z-10 font-mono">
                <div class="flex justify-center gap-4 mb-2">
                    <button onclick="setLang('de')" class="${currentLang==='de'?'text-black font-bold':'text-slate-400'}">DE</button>
                    <button onclick="setLang('en')" class="${currentLang==='en'?'text-black font-bold':'text-slate-400'}">EN</button>
                </div>
                <p class="uppercase tracking-widest">&copy; 2025 Jassgenossen Schällebur</p>
            </footer>`;

        // mountPage: gemeinsamer Seitenrahmen (Header, Login/Registrierung/Pending-Gates, Nav, Footer)
        // PAGE_KEY, AUTO_LOGIN_MODE ('none' | 'members' | 'required') werden pro Seite gesetzt.
        const mountPage = (contentHtml) => {
            const forcedLoginNow = (AUTO_LOGIN_MODE === 'members' && !user && !window.guestMode)
                || (AUTO_LOGIN_MODE === 'required' && !user && !userData && !window.guestMode);
            document.getElementById('app').innerHTML = `
                ${forcedLoginNow ? renderLoginModal() : ''}
                ${(user && !userData) ? renderRegistration() : ''}
                ${(userData && userData.role === 'pending') ? renderPendingScreen() : `
                ${renderHeader()}
                <main class="max-w-6xl mx-auto -mt-8 relative z-10 min-h-screen flex flex-col">
                    ${renderTopNav(PAGE_KEY)}
                    ${contentHtml}
                    ${renderFooter()}
                </main>
                ${renderBottomNav(PAGE_KEY)}
                `}
            `;
            if (window.lucide) window.lucide.createIcons();
            window.removeEventListener('scroll', handleScroll);
            window.addEventListener('scroll', handleScroll);
        };

        // --- GEMEINSAME ACTIONS: LOGIN / REGISTRIERUNG / SESSION ---
        window.openLoginModal = () => { document.getElementById('modal-container').innerHTML = renderLoginModal(); if (window.lucide) window.lucide.createIcons(); };
        window.closeModal = (e, force) => { if (force || e.target.id === 'modal-container') document.getElementById('modal-container').innerHTML = ''; };
        window.setLang = (l) => { currentLang = l; renderApp(); };
        window.setRegRole = (r) => { registrationRole = r; renderApp(); };

        window.loginGoogle = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); closeModal(null,true); } catch(e) { alert("Login Error: " + e.message); } };

        window.loginGuestAndRedirect = async () => {
            window.guestMode = true;
            closeModal(null,true);
            renderApp();
        };

        window.signOutUser = async () => { await signOut(auth); userData = null; window.guestMode = false; window.location.reload(); };

        window.completeRegistration = async () => {
            const name = document.getElementById('reg-name').value;
            const role = registrationRole;
            if(!name) return;
            const isAdminUser = user.email && ADMIN_EMAILS.includes(user.email);
            let roleKey = '';
            const legacy = LEGACY_DEBTS.find(l => (user.email && l.email && user.email.toLowerCase() === l.email.toLowerCase()) || (name && name.toLowerCase().includes(l.name.toLowerCase())));
            if(legacy) roleKey = legacy.roleKey;
            await setDoc(doc(db, COLLECTIONS.USERS, user.uid), { id: user.uid, name, role: isAdminUser ? 'admin' : 'pending', roleName: role === 'active' ? 'Aktivmitglied' : 'Gönner', avatar: user.photoURL || '', joined: serverTimestamp(), email: user.email || '', roleKey: roleKey });
        };


        const renderApp = () => {
            mountPage(renderTourneyDetail())
        };


        // --- INIT ---
        const startApp = async () => {
            if(!firebaseConfig.apiKey || firebaseConfig.apiKey === '*') return document.getElementById('app').innerHTML = "<div class='p-10 text-center font-comic text-red-600'><h1>Error: Firebase Config fehlt!</h1></div>";
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            onSnapshot(query(collection(db, COLLECTIONS.USERS)), sn => {
                users = sn.docs.map(d=>({id:d.id, ...d.data()}));
                if(user) userData = users.find(u => u.id === user.uid) || userData;
                if(userData?.role === 'admin') pendingUsers = users.filter(u => u.role === 'pending');
                renderApp();
            });

            currentTourneyId = new URLSearchParams(window.location.search).get('id');
            if (currentTourneyId) {
                onSnapshot(doc(db, TCOL.TOURNEYS, currentTourneyId), sn => { tourney = sn.exists() ? { id: sn.id, ...sn.data() } : null; renderApp(); });
                onSnapshot(query(collection(db, TCOL.REGS), where('tourneyId', '==', currentTourneyId)), sn => { tourneyRegs = sn.docs.map(d=>({id:d.id, ...d.data()})); renderApp(); });
            }

            onAuthStateChanged(auth, async (u) => {
                user = u;
                if (user && !user.isAnonymous) {
                    const userRef = doc(db, COLLECTIONS.USERS, user.uid);
                    const snap = await getDoc(userRef);
                    if (!snap.exists()) { userData = null; renderApp(); }
                    else { userData = snap.data(); if (user.email && ADMIN_EMAILS.includes(user.email) && userData.role !== 'admin') { await updateDoc(userRef, { role: 'admin' }); } renderApp(); }
                } else { userData = null; renderApp(); }
                
                renderApp();
            });
        };
        startApp();

    </script>
</body>
</html>
